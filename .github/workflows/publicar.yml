# Publica o boletim no GitHub Pages.
# - Se alguém enviar um .zip para o repositório, ele é descompactado na raiz,
#   o .zip é apagado e o resultado é salvo num commit automático.
# - Depois, o site é publicado (também roda quando o montador envia o dados.json).
#
# Arquivos protegidos: dados.json e a pasta imagens/ já existentes no repositório
# NÃO são substituídos pelo .zip, para não apagar edições publicadas pelo montador.

name: Publicar boletim

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar-boletim
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Descompactar arquivos .zip enviados
        run: |
          set -euo pipefail
          mapfile -t zips < <(git ls-files -- '*.zip' '*.ZIP')
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Nenhum .zip para descompactar."
            exit 0
          fi

          for z in "${zips[@]}"; do
            echo "::group::Descompactando $z"
            tmp="$(mktemp -d)"
            unzip -q -o "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            find "$tmp" -name '.DS_Store' -delete

            # Se o zip tiver uma única pasta por fora (ex.: boletim-interno/), usa o conteúdo dela.
            src="$tmp"
            mapfile -t topo < <(find "$tmp" -mindepth 1 -maxdepth 1)
            if [ ${#topo[@]} -eq 1 ] && [ -d "${topo[0]}" ]; then
              src="${topo[0]}"
            fi

            # O token automático não pode alterar workflows: ignora .github do zip.
            rm -rf "$src/.github"

            # Protege o que o montador publica.
            for protegido in dados.json imagens; do
              if [ -e "$protegido" ] && [ -e "$src/$protegido" ]; then
                echo "Mantendo o $protegido atual do repositório (o do zip foi ignorado)."
                rm -rf "$src/$protegido"
              fi
            done

            cp -a "$src"/. ./
            git rm -q -- "$z"
            rm -rf "$tmp"
            echo "::endgroup::"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -q -m "Atualiza o boletim a partir do .zip enviado"
            git push
          fi

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
