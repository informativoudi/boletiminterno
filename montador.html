<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montador do Boletim · Comunicação Interna</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'Unimed Sans';src:url('assets/fonts/UnimedSans-Regular.otf') format('opentype');font-weight:400}
@font-face{font-family:'Unimed Sans';src:url('assets/fonts/UnimedSans-SemiBold.otf') format('opentype');font-weight:600}
@font-face{font-family:'Unimed Sans';src:url('assets/fonts/UnimedSans-Bold.otf') format('opentype');font-weight:700}
@font-face{font-family:'Unimed Sans';src:url('assets/fonts/UnimedSans-ExtraBold.otf') format('opentype');font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
:root{--verde:#00995d;--petroleo:#004e4c;--lima:#b1d34b;--laranja:#f47920;--fundo:#f5f3ee;--borda:#e4e0d8;--rotulo:#736d61;--texto:#1f2420;--suave:#736d61}
html,body{height:100%}
body{font-family:'Unimed Sans',system-ui,sans-serif;background:var(--fundo);color:var(--texto);-webkit-font-smoothing:antialiased;font-size:14px;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--verde)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#d8d4cc;border-radius:5px;border:2px solid transparent;background-clip:content-box}
:focus-visible{outline:3px solid rgba(0,153,93,.45);outline-offset:1px}

.app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;height:66px;background:#cde3bb;color:var(--petroleo);flex-shrink:0;position:relative}
.top:after{content:'';position:absolute;left:0;right:0;bottom:-6px;height:6px;background:linear-gradient(90deg,var(--laranja) 0 25%,var(--lima) 25% 50%,var(--verde) 50% 75%,var(--petroleo) 75%)}
.marca{display:flex;align-items:center;gap:12px;min-width:0}
.marca-ic svg{display:none}
.marca-ic{width:34px;height:34px;border-radius:100% 0 0 0;background:var(--lima);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.marca b{display:block;font-size:15px;font-weight:800}
.marca span{display:block;font-size:11px;color:#3e5a4a}
.acoes{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tb{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 16px;border-radius:999px;border:0;background:#5d5e61;color:#fff;font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;text-decoration:none;transition:transform .15s,filter .15s}
.tb:hover{transform:translateY(-1px);filter:brightness(1.08)}
.tb.laranja{background:var(--laranja)}.tb.verde{background:var(--verde)}.tb.petroleo{background:var(--petroleo)}.tb.lima{background:var(--lima);color:var(--petroleo)}
.tb.on{background:var(--verde);color:#fff}.tb[aria-pressed=false]{background:#fff;color:var(--verde);box-shadow:inset 0 0 0 2px var(--verde)}
.tb.lima:hover{filter:brightness(1.05)}
.tb .dot{width:8px;height:8px;border-radius:50%;background:#9a9384}
.tb .dot.ok{background:var(--lima)}
.menu-wrap{position:relative}
.dropdown{position:absolute;right:0;top:44px;z-index:50;min-width:250px;background:#fff;color:var(--texto);border-radius:12px;box-shadow:0 18px 48px rgba(0,30,25,.25);padding:6px;display:none}
.dropdown.aberto{display:block}
.dropdown button,.dropdown a{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--texto);text-decoration:none}
.dropdown button:hover,.dropdown a:hover{background:#f4f2ec}
.dropdown hr{border:0;border-top:1px solid #eee;margin:4px 6px}

.shell{flex:1;display:flex;min-height:0;margin-top:6px}
.eds{width:244px;flex-shrink:0;background:#fff;border-right:1px solid var(--borda);display:flex;flex-direction:column;min-height:0}
.eds-cab{padding:16px 16px 10px;display:flex;justify-content:space-between;align-items:center}
.cap{font-size:10.5px;font-weight:800;color:var(--verde);letter-spacing:.12em;text-transform:uppercase}
.eds-lista{flex:1;overflow:auto;padding:0 10px 16px}
.ed{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:none;border-radius:11px;padding:10px;text-align:left;margin-bottom:4px}
.ed:hover{background:#f6f4ef}
.ed.sel{background:#eef6f0;border-color:#cfe6d8}
.ed-data{width:42px;height:42px;border-radius:10px;background:#f2efe9;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;color:var(--petroleo)}
.ed.sel .ed-data{background:var(--verde);color:#fff;border-radius:10px 10px 10px 0}
.ed-data b{font-size:11px;font-weight:800;text-transform:uppercase;line-height:1}
.ed-data span{font-size:10px;font-weight:700;opacity:.8}
.ed-info{flex:1;min-width:0}
.ed-info b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;margin-top:3px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.st-rascunho{background:#ece8e0;color:#555046}.st-espelho{background:#ffe7d2;color:#8a3d05}.st-online{background:#d6efe2;color:#00573a}.st-arquivada{background:#f2efe9;color:#736d61}

.editor{flex:1;overflow:auto;min-width:0}
.editor-in{max-width:780px;margin:0 auto;padding:24px 24px 120px}
.vazio{max-width:420px;margin:90px auto;text-align:center;color:var(--suave);line-height:1.6}
.vazio b{display:block;color:var(--petroleo);font-size:18px;margin-bottom:6px}
.card{background:#fff;border:1px solid var(--borda);border-radius:20px;margin-bottom:14px}
.card-cab{display:flex;align-items:center;gap:10px;padding:14px 16px}
.card-cab h2{font-size:15px;font-weight:800;color:var(--petroleo);flex:1;min-width:0}
.card-cab h2 small{display:block;font-size:12px;font-weight:600;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.card-corpo{padding:0 16px 18px}
.chip{flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--laranja);color:#fff}
.chip.t-gestao{background:var(--verde);color:#fff}.chip.t-caixas{background:var(--lima);color:var(--petroleo)}.chip.t-pessoas{background:var(--petroleo);color:#fff}
.bloco-cab{cursor:pointer;border-radius:16px}
.bloco-cab:hover{background:#faf9f6}
.ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--borda);background:#fff;color:#736d61;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ib:hover:not(:disabled){border-color:var(--verde);color:var(--verde)}
.ib:disabled{opacity:.35;cursor:default}
.ib.perigo:hover{border-color:#d64545;color:#d64545}
.grupo{display:flex;gap:4px;flex-shrink:0}
.campo{margin-top:14px}
.campo>label,.rot{display:block;font-size:10.5px;font-weight:800;color:var(--rotulo);letter-spacing:.09em;text-transform:uppercase;margin-bottom:6px}
.dica{font-size:12px;color:#736d61;margin-top:6px;line-height:1.5}
.linha{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.linha3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
input[type=text],input[type=url],input[type=month],input[type=password],select,textarea{width:100%;height:38px;padding:0 12px;border:1.5px solid var(--borda);border-radius:9px;background:#fff;outline:none;transition:border-color .15s}
textarea{height:auto;min-height:90px;padding:10px 12px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--verde)}
.seg{display:flex;background:#f2efe9;border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:700;color:#555046;white-space:nowrap}
.seg button[aria-pressed=true]{background:#fff;color:var(--petroleo);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--verde)}

.rt{border:1.5px solid var(--borda);border-radius:10px;background:#fff;transition:border-color .15s}
.rt:focus-within{border-color:var(--verde)}
.rt-bar{display:flex;flex-wrap:wrap;gap:2px;padding:5px;border-bottom:1px solid #efece6;background:#fbfaf7;border-radius:10px 10px 0 0}
.rt-bar button{min-width:30px;height:28px;border:0;border-radius:6px;background:none;font-weight:700;color:#555046;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 7px;font-size:13px}
.rt-bar button:hover{background:#efece6}
.rt-sep{width:1px;background:#e4e0d8;margin:4px 3px}
.rt-ed{min-height:96px;padding:12px 14px;line-height:1.6;outline:none;font-size:14px}
.rt-ed.curto{min-height:56px}
.rt-ed p{margin:0 0 10px}.rt-ed p:last-child{margin:0}
.rt-ed ul,.rt-ed ol{margin:6px 0 10px 20px}
.rt-ed:empty:before{content:attr(data-ph);color:#a8a294}
.rt-ed a{color:var(--verde);text-decoration:underline}
mark{color:inherit;padding:1px 5px;border-radius:9px}
mark.r-verde{background:#d6efe2}mark.r-lima{background:#e6f2bf}mark.r-laranja{background:#ffe0c4}mark.r-azul{background:#d7ebf2}mark.r-amarelo{background:#fff1b8}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}

.lista-itens>.item{border:1px solid #ece8e0;border-radius:12px;padding:12px;margin-top:10px;background:#fcfbf9}
.item-cab{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.item-cab b{flex:1;font-size:12px;font-weight:800;color:var(--petroleo);text-transform:uppercase;letter-spacing:.05em}
.add{display:inline-flex;align-items:center;gap:7px;margin-top:10px;height:34px;padding:0 14px;border:1.5px dashed #c3bcae;border-radius:9px;background:none;font-weight:700;font-size:12.5px;color:#555046}
.add:hover:not(:disabled){border-color:var(--verde);color:var(--verde);background:#f4faf6}
.add:disabled{opacity:.45;cursor:default}
.midia{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start}
.thumb{width:64px;height:64px;border-radius:9px;background:#f2efe9 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#9a9384;overflow:hidden}
.flex{display:flex;gap:8px;align-items:center}
.flex>input{flex:1;min-width:0}
.mini{height:38px;padding:0 12px;border:1.5px solid var(--borda);border-radius:9px;background:#fff;font-weight:700;font-size:12.5px;color:#555046;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.mini:hover{border-color:var(--verde);color:var(--verde)}
.pessoas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.pessoa{border:1px solid #ece8e0;border-radius:12px;padding:10px;background:#fcfbf9}
.pessoa-topo{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pessoa .thumb{width:56px;height:56px;border-radius:12px;font-weight:800;color:var(--petroleo);background-color:#cde3bb}
.pessoa input{height:34px;font-size:13px;margin-top:6px}
.cat-bloco{border:1.5px solid #cfe3c0;border-radius:16px;padding:14px;margin-top:12px;background:#f6faf1}
.cat-cab{display:flex;gap:8px;align-items:center;padding-bottom:10px;border-bottom:1px solid #dcebd0;margin-bottom:6px}
.cat-cab>input{flex:1;min-width:0}
.cat-ic{width:38px;height:38px;border-radius:10px;background:#cde3bb;color:#004e4c;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cat-item{border:1px solid #e4e0d8;border-radius:12px;padding:12px;margin-top:10px;background:#fff}
.add-blocos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:6px 0 20px}
.add-bloco{border:1.5px dashed #c3bcae;border-radius:14px;background:none;padding:14px;text-align:left}
.add-bloco:hover{border-color:var(--verde);background:#f4faf6}
.add-bloco b{display:block;color:var(--petroleo);font-size:13.5px;margin-bottom:3px}
.add-bloco span{font-size:12px;color:var(--suave);line-height:1.4}
.titulo-sec{font-size:13px;font-weight:700;color:var(--laranja);letter-spacing:.12em;text-transform:uppercase;margin:26px 2px 10px}
.status-box{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding:12px;border-radius:12px;background:#f7f5f0}
.bt{height:36px;padding:0 14px;border-radius:9px;border:0;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.bt.verde{background:var(--verde);color:#fff}
.bt.laranja{background:var(--laranja);color:#fff}
.bt.cinza{background:#fff;color:#555046;border:1.5px solid var(--borda)}
.bt:hover{filter:brightness(1.05)}

.prev{width:var(--pw,520px);flex-shrink:0;border-left:1px solid var(--borda);background:#e9e6df;display:flex;flex-direction:column;min-height:0}
.prev.fechado{display:none}
.prev-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--borda);background:#f7f5f0}
.prev-palco{flex:1;overflow:auto;display:flex;justify-content:center;padding:14px}
.prev iframe{border:0;background:#fff;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.1);height:100%;width:100%}
.prev.celular iframe{width:390px;flex-shrink:0}
.prev.celular{--pw:440px}

.modal-fundo{position:fixed;inset:0;background:rgba(10,30,25,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:18px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal h3{font-size:18px;color:var(--petroleo);margin-bottom:6px}
.modal p{color:var(--suave);line-height:1.55;font-size:13.5px}
.modal pre{background:#f4f2ec;border-radius:10px;padding:12px;font-size:11.5px;overflow:auto;white-space:pre-wrap;word-break:break-all;max-height:200px;margin-top:8px}
.modal-acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.login-fundo{position:fixed;inset:0;z-index:100;background:#cde3bb;display:flex;align-items:center;justify-content:center;padding:20px}
.login{position:relative;background:#fff;border-radius:22px;width:min(400px,100%);padding:34px 30px 24px;box-shadow:0 30px 70px rgba(0,60,40,.18)}
.login-folha{width:46px;height:46px;background:var(--lima);border-radius:100% 0 0 0;margin-bottom:16px}
.login h1{font-size:22px;color:var(--petroleo);font-weight:800}
.login>p{color:var(--suave);font-size:13px;margin:2px 0 18px}
.login label:not(.check){display:block;font-size:10.5px;font-weight:800;color:var(--rotulo);letter-spacing:.09em;text-transform:uppercase;margin:12px 0 6px}
.login input[type=text],.login input[type=password]{height:42px}
.login-erro{min-height:18px;margin-top:10px;text-align:center;color:#c2410c;font-weight:700;font-size:13px}
.login-admin{display:block;margin:8px auto 0;border:0;background:none;color:#736d61;font-size:12px;font-weight:700;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--petroleo);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:13.5px;z-index:90;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:min(560px,92vw);text-align:center}
.alerta{padding:10px 12px;border-radius:10px;background:#fff3e7;color:#8a3d05;font-size:12.5px;line-height:1.5;margin-top:10px}

@media (max-width:1180px){.prev{--pw:420px}}
@media (max-width:980px){.eds{display:none}.prev{position:fixed;inset:62px 0 0 auto;width:min(440px,100vw);z-index:30;box-shadow:-10px 0 30px rgba(0,0,0,.15)}.top .esconde{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="marca">
      <div class="marca-ic"><svg aria-hidden="true" width="0" height="0" viewBox="0 0 24 24" fill="none" stroke="#b1d34b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
      <div><b>Montador do Boletim</b><span>Comunicação Interna · Grupo Unimed Uberlândia</span></div>
    </div>
    <div class="acoes">
      <button type="button" class="tb laranja" data-a="nova-edicao"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nova edição</button>
      <button type="button" class="tb on" id="btn-previa" data-a="toggle-previa" aria-pressed="true"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>Prévia</button>
      <a class="tb petroleo esconde" href="index.html" target="_blank" rel="noopener">Ver boletim ↗</a>
      <div class="menu-wrap">
        <button type="button" class="tb lima" data-a="menu" aria-expanded="false" aria-haspopup="true" id="btn-mais">Mais ▾</button>
        <div class="dropdown" id="menu-mais" role="menu">
          <button type="button" role="menuitem" data-a="equipe">Equipe (usuários e senhas)</button>
          <button type="button" role="menuitem" data-a="framer">Código para o Framer</button>
          <button type="button" role="menuitem" data-a="legados">Edições antigas (Framer)</button>
          <hr>
          <button type="button" role="menuitem" data-a="exportar">Baixar backup (.json)</button>
          <button type="button" role="menuitem" data-a="importar">Restaurar backup…</button>
          <button type="button" role="menuitem" data-a="baixar-site">Baixar dados.json do site</button>
          <button type="button" role="menuitem" data-a="buscar-site">Buscar a versão publicada</button>
        </div>
      </div>
      <button type="button" class="tb" data-a="github" id="btn-gh"><span class="dot" id="gh-dot"></span>GitHub</button>
    </div>
  </header>
  <div class="shell">
    <aside class="eds" aria-label="Edições">
      <div class="eds-cab"><span class="cap">Edições</span></div>
      <div class="eds-lista" id="lista-edicoes"></div>
    </aside>
    <main class="editor" id="editor"></main>
    <section class="prev" id="previa" aria-label="Prévia do boletim">
      <div class="prev-bar">
        <div class="seg" role="group" aria-label="Tamanho da prévia" style="flex:0 0 auto">
          <button type="button" data-a="prev-modo" data-v="desktop" aria-pressed="true">Computador</button>
          <button type="button" data-a="prev-modo" data-v="celular" aria-pressed="false">Celular</button>
        </div>
        <span style="font-size:11.5px;color:#736d61;font-weight:600" id="prev-info">Atualiza enquanto você edita</span>
      </div>
      <div class="prev-palco"><iframe id="frame" title="Prévia do boletim" src="index.html?preview=1"></iframe></div>
    </section>
  </div>
</div>
<input type="file" id="arquivo" accept="image/*" hidden>
<input type="file" id="arquivo-multi" accept="image/*" multiple hidden>
<input type="file" id="arquivo-json" accept=".json,application/json" hidden>
<div id="camada"></div>
<script src="boletim.js"></script>
<script src="montador.js"></script>
</body>
</html>
